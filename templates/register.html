{% extends 'base.html' %}

{% block title %}회원가입{% endblock %}

{% block content %}
    <h2>회원가입</h2>
    <form method="post" action="{% url 'accounts:register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button primary-button">회원가입</button>
    </form>
    <a href="{% url 'accounts:login' %}" class="button secondary-button">로그인 페이지로</a>
{% endblock %}
