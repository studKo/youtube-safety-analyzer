{% extends 'base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
    <h2>로그인</h2>
    <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button primary-button">로그인</button>
    </form>
    <a href="{% url 'accounts:register' %}" class="button secondary-button">회원가입</a>
{% endblock %}
